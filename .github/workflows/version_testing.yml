name: Python Multi-Environment Tests

on:
  push:
    #branches: [ "main" ] # commented out to test pushes
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]         # Testing different Linux versions
        python-version: ['3.10', '3.11', '3.12'] # Testing different Python versions

    steps:
    - name: Check out the code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # - name: Install dependencies
    #   run: |
    #     python -m pip install --upgrade pip
    #     pip install -r ./server/src/server/requirements.txt

    - name: Deploy
      run: |
        # Testing out deployment
        sudo make deploy
        echo "Successfully deployed LongHaulC2"

    - name: Run tests
      run: |
        # Testing out deployment
        sudo make deploy
        echo "Successfully running tests on ${{ matrix.os }} with Python ${{ matrix.python-version }}"