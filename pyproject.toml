# hi! This configures the python global settings for the project.

[tool.ruff]
target-version = "py312"
line-length = 120

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "logs",
    "*.h",    # exclude implant source
    "*.hpp",  # exclude implant source
    "*.c",    # exclude implant source
    "*.cpp",  # exclude implant source
    "*.md",    # exclude docs
    "*test*"  # exclude any tests
]

[tool.ruff.lint]
# G = Logging, E/F = Syntax/Logic, I = Import Sorting, UP moves old py semantics to new ones
select = ["G", "E", "F", "I", "UP", "PERF", "FURB"]
# Tell Ruff which variable names are actually loggers
logger-objects = [
    "api_logger",
    "server_logger",
    "listener_logger",
    "neo4j_logger",
    "response_pipeline_logger"
]

[tool.ruff.format]
# This ensures Ruff's formatter behaves like Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
